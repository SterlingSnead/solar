name: Build Y2 ROM

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-y2-rom:
    # 2026-10-29 — Fork: upstream-only (needs upstream secrets / publishes upstream). Forks use build-y2-fork.yml.
    if: github.repository == 'thesolarproject/solar'
    name: Build Y2 ROM
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install legacy Android SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-19" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: |
          echo "Building Solar release APK..."
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk .

      - name: Build Y2 ROM
        run: |
          echo "Building Innioasis Y2 ROM..."
          sudo SKIP_ROCKBOX_XPOSED=1 bash solar-rom/scripts/build-rom.sh y2 \
            --apk app-release.apk \
            solar-rom/dist/rom_y2.zip

      - name: Verify ROM
        run: |
          if [ -f "solar-rom/dist/rom_y2.zip" ]; then
            echo "Y2 ROM built: $(ls -lh solar-rom/dist/rom_y2.zip)"
            unzip -l solar-rom/dist/rom_y2.zip | grep -E 'system\.img|MT6582|boot\.img'
          else
            echo "ERROR: rom_y2.zip missing"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: y2-rom
          path: solar-rom/dist/rom_y2.zip
          retention-days: 1

      - name: Set release metadata
        id: meta
        run: |
          echo "build_time=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: y2-release
          name: "Solar Y2 ROM v${{ steps.meta.outputs.build_time }}"
          body: "Solar Y2 ROM for Innioasis Y2 (MT6582 ATA). Built from ${{ steps.meta.outputs.short_sha }}."
          draft: false
          prerelease: false
          files: solar-rom/dist/rom_y2.zip
